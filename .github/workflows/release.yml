# Publishes a release when a version tag is pushed (script/release.sh does
# that). The app checks these releases and offers "Restart to update".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      # The Developer ID certificate goes into a throwaway keychain that only
      # this job uses. Secrets are set in the repository settings; see
      # "Signing" in README.md.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "No Developer ID Application certificate in MACOS_CERTIFICATE_P12" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build the app bundle
        run: script/bundle.sh

      - name: Notarize
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY_P8" > "$APPLE_API_KEY_PATH"
          script/notarize.sh "target/release/Pi GPUI.app"
          rm "$APPLE_API_KEY_PATH"

      - name: Package
        run: |
          asset="Pi-GPUI-$VERSION-aarch64.zip"
          ditto -c -k --sequesterRsrc --keepParent "target/release/Pi GPUI.app" "target/release/$asset"
          echo "ASSET=target/release/$asset" >> "$GITHUB_ENV"
          # Which pi versions this release supports; read by the app's updater.
          "target/release/Pi GPUI.app/Contents/MacOS/pi-gpui" --pi-compat > target/release/pi-compat.json
          cat target/release/pi-compat.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" target/release/pi-compat.json \
            --title "Pi GPUI $VERSION" \
            --generate-notes

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
