# Publishes a release when a version tag is pushed (script/release.sh does
# that). The app checks these releases and offers "Restart to update".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build the app bundle
        run: script/bundle.sh

      - name: Package
        run: |
          asset="Pi-GPUI-$VERSION-aarch64.zip"
          ditto -c -k --sequesterRsrc --keepParent "target/release/Pi GPUI.app" "target/release/$asset"
          echo "ASSET=target/release/$asset" >> "$GITHUB_ENV"
          # Which pi versions this release supports; read by the app's updater.
          "target/release/Pi GPUI.app/Contents/MacOS/pi-gpui" --pi-compat > target/release/pi-compat.json
          cat target/release/pi-compat.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" target/release/pi-compat.json \
            --title "Pi GPUI $VERSION" \
            --generate-notes
