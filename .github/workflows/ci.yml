# Builds and tests the Linux app on every change to the code, so a release
# never finds out about a Linux break. The tarball is kept as an artifact for
# trying a change before it is released.
name: CI

on:
  push:
    branches: [main]
    paths: ["src/**", "assets/**", "extensions/**", "Cargo.*", "rust-toolchain.toml", "script/bundle-linux.sh", "script/linux-deps.sh", "resources/linux/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "assets/**", "extensions/**", "Cargo.*", "rust-toolchain.toml", "script/bundle-linux.sh", "script/linux-deps.sh", "resources/linux/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: script/linux-deps.sh

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build the tarball
        run: script/bundle-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pi-gpui-linux-${{ runner.arch }}
          path: target/release/pi-gpui-*-linux-*.tar.gz
          retention-days: 14
